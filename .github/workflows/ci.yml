name: ci
run-name: ci

on:
  pull_request:
    branches: ["*"]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: jjohns-dev/pwsh-module-ci/.github/workflows/ci.yml@spike/adr-0006-harness-self-checkout
    with:
      os-matrix: '["ubuntu-latest"]'
      min-tests: 87 # 91 collected - min(floor(91 * 0.05), 10) = 91 - 4
    permissions:
      contents: read
      checks: write
