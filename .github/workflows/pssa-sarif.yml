name: pssa-sarif
run-name: pssa-sarif

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: psscriptanalyzer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    uses: jjohns-dev/pwsh-module-ci/.github/workflows/pssa-sarif.yml@v1.3.1
    permissions:
      contents: read
      security-events: write
